name: Daily Data Refresh

on:
  schedule:
    # 10:00 AM IST is 04:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch: # Allow manual triggering from the GitHub UI

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Fetch Pipeline
        run: python ingestion/fetch.py
        
      - name: Run Parse Pipeline
        run: python ingestion/parse.py
        
      - name: Run Chunk and Index Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python ingestion/chunk_and_index.py
        
      - name: Commit and push updated Vector DB
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Automated daily data refresh [skip ci]" || echo "No changes to commit"
          git push
